[package]
name = "pg-jsonl"
version = "0.1.0"
description = "Streaming parser for property-graph JSON Lines (PG-JSONL) node and edge files, including Neo4j APOC JSON exports"
authors = ["DataRoad Inc, Delaware, USA, trading as Legra"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/legra-ai/pg-jsonl"
keywords = ["jsonl", "property-graph", "neo4j", "parser", "streaming"]
categories = ["parsing", "data-structures"]
publish = true
build = "build.rs"
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "build.rs",
]

[lib]
doctest = true

[dependencies]
property-graph-model = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"

[features]
# Conversions from this crate's parsed records into the format-neutral
# `property-graph-model` records used by streaming property-graph pipelines.
property-graph-model = ["dep:property-graph-model"]

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
